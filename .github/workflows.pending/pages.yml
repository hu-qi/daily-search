name: pages

on:
  # daily-search 由 GITHUB_TOKEN 推送的报告不会触发 push workflow_run，
  # 因此必须显式监听 daily-search 完成事件，Pages 才会随每日报告更新。
  workflow_run:
    workflows: ["daily-search"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "feed.xml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build site
        run: python -m daily_search pages --site-dir site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4